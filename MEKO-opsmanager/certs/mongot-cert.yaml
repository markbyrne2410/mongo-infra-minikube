apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mdb-rs-search-cert
spec:
  secretName: mdb-mdb-rs-search-cert
  duration: 8760h    # 1 year
  renewBefore: 720h  # 30 days
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - server auth
    - client auth
  dnsNames:
    - "*.mdb-rs-search-svc.mongodb.svc.cluster.local"
  issuerRef:
    name: my-ca
    kind: Issuer