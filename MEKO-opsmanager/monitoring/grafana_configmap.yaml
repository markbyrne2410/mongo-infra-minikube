apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: aelwdhhuo2pz4f
        access: proxy
        url: http://prometheus-server:9090
        isDefault: true
---
apiVersion: v1  
kind: ConfigMap  
metadata:  
  name: grafana-dashboards-provider  
data:  
  dashboards.yml: |  
    apiVersion: 1

    providers:  
      - name: 'MongoDB Dashboards'  
        orgId: 1  
        folder: ''  
        type: file  
        disableDeletion: false  
        updateIntervalSeconds: 10  
        allowUiUpdates: true  
        options:  
          path: /var/lib/grafana/dashboards 
